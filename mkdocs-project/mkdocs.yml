site_name: "Cloud Security Engineering"
site_description: "Deep-dive research, threat models, and defensive architecture for cloud-native security"
site_url: "https://docs.jasonachkardiab.com"
site_author: "Jason Achkar Diab"
repo_name: "jasonachkar/cybersecurity-writeups"
repo_url: "https://github.com/jasonachkar/cybersecurity-writeups"
edit_uri: ""

docs_dir: docs
site_dir: site

# Runnable labs intentionally live outside the physical MkDocs tree. The
# canonical-content hook mounts their Markdown without duplicating source.
validation:
  links:
    not_found: info

hooks:
  - hooks/canonical_content.py

theme:
  name: material
  custom_dir: overrides
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.top
    - navigation.path
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight

extra_css:
  - css/custom.css

extra_javascript:
  - js/docs-ui.js
  - js/source-viewer.js

watch:
  - ../appsec
  - ../cloud-security
  - ../devsecops
  - ../threat-intel
  - ../labs
  - ../site-pages
  - ../scripts

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: false
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Navigation is generated by hooks/canonical_content.py from canonical metadata.
