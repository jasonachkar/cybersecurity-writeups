site_name: "Cloud Security Engineering"
site_description: "Deep-dive research, threat models, and defensive architecture for cloud-native security"
site_url: "https://docs.jasonachkardiab.com"
site_author: "Jason Achkar Diab"
repo_name: "jasonachkar/cybersecurity-writeups"
repo_url: "https://github.com/jasonachkar/cybersecurity-writeups"
edit_uri: "edit/main/"

docs_dir: docs
site_dir: site

# Runnable labs intentionally live outside the physical MkDocs tree. The
# canonical-content hook mounts their Markdown without duplicating source.
validation:
  links:
    not_found: info

hooks:
  - hooks/canonical_content.py

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.top
    - navigation.breadcrumbs
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select

extra_css:
  - css/custom.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Research:
      - Overview: research/index.md
      - Cloud Security:
          - Overview: cloud-security/index.md
          - IAM and workload federation: cloud-security/iam-at-scale.md
          - Network segmentation: cloud-security/cloud-network-segmentation.md
          - Landing zones: cloud-security/multi-account-landing-zones.md
          - Kubernetes isolation: cloud-security/kubernetes-multi-tenancy.md
          - Detection and response: cloud-security/cloud-detection-and-response.md
          - Serverless security: cloud-security/serverless-security.md
      - Application Security:
          - Overview: appsec/index.md
          - AI-agent authorization: appsec/ai-agent-security.md
          - Multi-tenant SaaS isolation: appsec/saas-multitenancy-isolation.md
          - OAuth 2.0 and OIDC: appsec/oauth2-oidc-deep-dive.md
          - API threat modeling: appsec/api-microservices-threat-modeling.md
          - Runtime protection: appsec/runtime-protection-rasp-waf.md
      - DevSecOps:
