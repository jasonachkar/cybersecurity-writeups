          - IaC policy engineering: devsecops/iac-security-and-policy-as-code.md
          - Supply-chain evidence: devsecops/supply-chain-sbom-signing.md
          - Secrets management: devsecops/secrets-management.md
          - SecureObs architecture: devsecops/secureobs-multitenant-security-scanner.md
      - Threat Intelligence:
          - Overview: threat-intel/index.md
          - Attack-path analysis: threat-intel/attack-path-analysis.md
          - Incident case studies: threat-intel/cloud-breach-case-studies.md
  - Labs:
      - Overview: labs/index.md
      - Secure CI/CD: labs/secure-cicd/README.md
      - IAM and OIDC: labs/iam-oidc/README.md
      - OAuth and OIDC: labs/oauth-oidc/README.md
      - AI-agent security: labs/ai-agent-security/README.md
      - PostgreSQL RLS: labs/postgresql-rls/README.md
      - Kubernetes security: labs/kubernetes-security/README.md
      - Supply-chain policy: labs/supply-chain/README.md
