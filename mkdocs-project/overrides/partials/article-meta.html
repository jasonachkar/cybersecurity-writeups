<header class="docs-article-header">
  {% if docs_page.summary %}<p class="docs-article-header__summary">{{ docs_page.summary }}</p>{% endif %}
  <p class="docs-article-header__orientation">
    <span>{{ docs_page.domainLabel }}</span>
    {% if docs_page.readingTime %}<span aria-hidden="true">·</span><span>{{ docs_page.readingTime }} min read</span>{% endif %}
  </p>
</header>
