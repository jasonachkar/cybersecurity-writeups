# Gitleaks configuration for the gh-pages portfolio branch.
#
# Working-tree and git-history scans both use this file. Findings fail CI.
#
# The path below is a retired educational secret-scanner demo that was removed
# from the tree. Historical commits still contain synthetic fixture strings
# used to teach detection rules; they were never live credentials. History is
# not rewritten on this shared branch; the retired path is allowlisted instead.

title = "cybersecurity-writeups"

[[allowlists]]
description = "Retired educational secret-scanner demo (synthetic fixtures only; file removed from tree)"
paths = [
  '''(^|/)devsecops/scripts/secret-scanner\.go$''',
]
