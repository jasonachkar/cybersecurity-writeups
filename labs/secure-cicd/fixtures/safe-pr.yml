name: Untrusted pull request validation example

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out pull-request merge revision without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.12.0"
          cache: npm

      - name: Install the reviewed lockfile without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Pass untrusted metadata as data, not shell source
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: printf '%s\n' "$PR_TITLE"
