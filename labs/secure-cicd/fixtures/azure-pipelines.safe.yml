trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-24.04

steps:
  - checkout: self
    clean: true
    persistCredentials: false

  - task: NodeTool@0
    inputs:
      versionSpec: 24.12.0

  - script: npm ci --ignore-scripts
    displayName: Install reviewed lockfile

  - script: npm run validate
    displayName: Validate untrusted source without deployment credentials
