# Admission-control case corpus for labs/kubernetes-security.
# Every pod differs from "compliant-app" in exactly one property, named in the
# lab.example/violates annotation. Expected outcomes per engine are in
# expectations.json and were written BEFORE the engines were run; see README.
apiVersion: v1
kind: Pod
metadata:
  name: compliant-app
  namespace: lab-hardened
  labels:
    app: case
  annotations:
    lab.example/violates: none
spec:
  serviceAccountName: app
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: dockerlab/posture:hardened
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 128Mi
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir:
        medium: Memory
        sizeLimit: 8Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: compliant-api-reader
  namespace: lab-hardened
  labels:
    app: case
    lab.example/api-access: approved
  annotations:
    lab.example/violates: none (token projected, approved)
spec:
  serviceAccountName: api-reader
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: dockerlab/posture:hardened
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 128Mi
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: api-token
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
  volumes:
    - name: tmp
      emptyDir:
        medium: Memory
        sizeLimit: 8Mi
    - name: api-token
      projected:
        defaultMode: 292
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
---
