apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: hardened-pod-baseline
policies:
  - policies/hardened-pods.yaml
resources:
  - fixtures/pods.yaml
results:
  - isValidatingPolicy: true
    policy: hardened-pods
    kind: Pod
    resources:
      - allowed-workload
    result: pass
  - isValidatingPolicy: true
    policy: hardened-pods
    kind: Pod
    resources:
      - rejected-privileged
      - rejected-host-namespace
      - rejected-hostpath
      - rejected-capability
      - rejected-missing-resources
      - rejected-token-automount
    result: fail
