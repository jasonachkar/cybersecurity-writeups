# HARDENED network segmentation. NetworkPolicy is additive allow-listing: pods
# selected by ANY policy are denied everything not explicitly allowed.
#
# 192.0.2.1/32 below (TEST-NET-1, a documentation range) is a placeholder that
# scripts/run-cluster-lab.sh replaces with the real API server endpoint IP at apply
# time, because Calico evaluates the post-DNAT destination.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: lab-hardened
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: lab-hardened
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-egress-to-data-tier
  namespace: lab-hardened
spec:
  podSelector:
    matchLabels: {app: app}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lab-data
          podSelector:
            matchLabels: {app: canary}
      ports:
        - {protocol: TCP, port: 9000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-reader-egress-to-apiserver
  namespace: lab-hardened
spec:
  podSelector:
    matchLabels: {app: api-reader}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 192.0.2.1/32
      ports:
        - {protocol: TCP, port: 6443}
---
# Data tier: isolate ingress so only the hardened app can connect. Applying this
# AFTER the baseline measurements shows the same baseline pod losing access.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: lab-data
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-hardened-app
  namespace: lab-data
spec:
  podSelector:
    matchLabels: {app: canary}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lab-hardened
          podSelector:
            matchLabels: {app: app}
      ports:
        - {protocol: TCP, port: 9000}
