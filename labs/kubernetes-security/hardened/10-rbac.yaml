# HARDENED counterpart: identities that can do exactly what the workload needs.
#
# app          needs no Kubernetes API access -> no token at all.
# api-reader   needs to read ONE ConfigMap -> a namespaced Role limited by resourceNames.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: lab-hardened
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-reader
  namespace: lab-hardened
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: lab-hardened
data:
  greeting: hello
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: unrelated-config
  namespace: lab-hardened
data:
  note: api-reader must not be able to read this
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-reader
  namespace: lab-hardened
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["app-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-reader
  namespace: lab-hardened
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: config-reader
subjects:
  - kind: ServiceAccount
    name: api-reader
    namespace: lab-hardened
