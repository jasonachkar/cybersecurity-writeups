# HARDENED admission, layer 2. Pod Security Admission (the namespace labels) covers
# the Pod Security Standards; it does NOT require resource limits, forbid :latest,
# require a read-only root filesystem, or restrict service-account token projection.
# This ValidatingAdmissionPolicy (CEL, built into the API server, no webhook) adds
# those controls. failurePolicy Fail: if the policy cannot be evaluated, deny.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: lab-pod-extra-controls
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c,
          has(c.resources) && has(c.resources.limits)
          && has(c.resources.limits.cpu) && has(c.resources.limits.memory))
      message: Every container must set CPU and memory limits.
      reason: Invalid
    - expression: >-
        variables.containers.all(c,
          c.image.contains('@sha256:')
          || (c.image.matches('^[^@]*:[^:/@]+$') && !c.image.endsWith(':latest')))
      message: Images must be pinned by digest or carry an explicit non-latest tag.
      reason: Invalid
    - expression: >-
        variables.containers.all(c, c.?securityContext.?readOnlyRootFilesystem.orValue(false) == true)
      message: Containers must use a read-only root filesystem.
      reason: Invalid
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v,
          !(has(v.projected) && v.projected.sources.exists(s, has(s.serviceAccountToken)))
          || (object.metadata.?labels.orValue({})[?'lab.example/api-access'].orValue('') == 'approved'
              && object.spec.?serviceAccountName.orValue('default') != 'default'))
      message: >-
        A service-account token (automounted or projected) requires the reviewed
        label lab.example/api-access=approved and a non-default ServiceAccount.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: lab-pod-extra-controls
spec:
  policyName: lab-pod-extra-controls
  # Deny rejects; Audit records the decision in the API server audit log.
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchLabels:
        lab.example/admission: enforced
