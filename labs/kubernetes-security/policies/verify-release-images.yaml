apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-secureobs-release
  annotations:
    policies.kyverno.io/title: Verify SecureObs release identity and provenance
    policies.kyverno.io/category: Software Supply Chain
    policies.kyverno.io/severity: high
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
    mode: Kubernetes
  webhookConfiguration:
    timeoutSeconds: 15
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchImageReferences:
    - glob: "ghcr.io/jasonachkar/secureobs:*"
  attestors:
    - name: releaseIdentity
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subject: "https://github.com/jasonachkar/secureobs/.github/workflows/release.yml@refs/heads/main"
        ctlog:
          url: "https://rekor.sigstore.dev"
  attestations:
    - name: slsaProvenance
      intoto:
        type: "https://slsa.dev/provenance/v1"
  validationConfigurations:
    mutateDigest: true
    required: true
    verifyDigest: true
  validations:
    - message: Image signature is missing or the keyless workflow identity is not authorized.
      expression: >-
        images.containers
          .map(image, verifyImageSignatures(image, [attestors.releaseIdentity]))
          .all(result, result > 0)
    - message: SLSA provenance is missing or is not signed by the authorized workflow identity.
      expression: >-
        images.containers
          .map(image, verifyAttestationSignatures(
            image,
            attestations.slsaProvenance,
            [attestors.releaseIdentity]))
          .all(result, result > 0)
