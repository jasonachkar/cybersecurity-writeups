name: gh-pages quality

on:
  pull_request:
    branches:
      - gh-pages
  push:
    branches:
      - codex/validated-gh-pages-deployment
  workflow_dispatch:

concurrency:
  group: gh-pages-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-site:
    name: static-site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Static validation
        run: npm run verify:static
      - name: Upload static reports
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: qa-static
          path: qa/*.json

  javascript-labs:
    name: javascript-labs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install lab dependencies
        run: |
          set -euo pipefail
          npm install --prefix labs/secure-cicd
          npm install --prefix labs/supply-chain
      - run: npm run verify:labs

  go-utilities:
    name: go-utilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.22.x"
      - run: |
          set -euo pipefail
          for mod in appsec/scripts/oauth-pkce threat-intel/scripts/cloudtrail cloud-security/scripts/k8s-rbac; do
            (cd "$mod" && gofmt -w . && go test ./... && go vet ./...)
          done

  policy-and-iac:
    name: policy-and-iac
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.5"
      - run: npm ci
      - name: Terraform validate
        run: npm run verify:terraform
      - name: Kyverno / Tetragon schema checks
        run: |
          set -euo pipefail
          python3 -m pip install --user pyyaml jsonschema
          mkdir -p qa/runtime
          curl -sL -o qa/runtime/tetragon-tracingpoliciesnamespaced-v1.7.0.yaml \
            https://raw.githubusercontent.com/cilium/tetragon/v1.7.0/pkg/k8s/apis/cilium.io/client/crds/v1alpha1/cilium.io_tracingpoliciesnamespaced.yaml
          curl -sL -o qa/runtime/kyverno-imagevalidatingpolicies-v1.18.0.yaml \
            https://raw.githubusercontent.com/kyverno/kyverno/v1.18.0/config/crds/policies.kyverno.io/policies.kyverno.io_imagevalidatingpolicies.yaml
          python3 scripts/validate-tetragon-policy.py \
            qa/runtime/tetragon-tracingpoliciesnamespaced-v1.7.0.yaml \
            appsec/runtime-protection-rasp-waf/tetragon-v1.7.0-shell-policy.yaml
          python3 scripts/validate-kyverno-policy.py \
            qa/runtime/kyverno-imagevalidatingpolicies-v1.18.0.yaml \
            labs/kubernetes-security/policies/verify-release-images.yaml

  postgresql-rls:
    name: postgresql-rls
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run disposable PostgreSQL RLS lab
        working-directory: labs/postgresql-rls
        run: bash ./run-tests.sh

  accessibility:
    name: accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:a11y
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: qa-accessibility
          path: qa/accessibility-report.json

  external-links:
    name: external-links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run verify:links
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: qa-external-links
          path: qa/external-link-report.json

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run verify:secrets
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: qa-gitleaks
          path: qa/gitleaks-report.json

  verify-evidence-reports:
    name: verify-evidence-reports
    runs-on: ubuntu-latest
    needs:
      - static-site
      - accessibility
      - external-links
      - secret-scan
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: qa-artifacts
      - name: Assemble and verify reports
        run: |
          set -euo pipefail
          mkdir -p qa
          find qa-artifacts -name '*.json' -exec cp {} qa/ \;
          npm run verify:summary
          npm run verify:provenance

  summary:
    name: summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - static-site
      - javascript-labs
      - go-utilities
      - policy-and-iac
      - postgresql-rls
      - accessibility
      - external-links
      - secret-scan
      - verify-evidence-reports
    steps:
      - name: Require all jobs green
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.static-site.result }}" \
            "${{ needs.javascript-labs.result }}" \
            "${{ needs.go-utilities.result }}" \
            "${{ needs.policy-and-iac.result }}" \
            "${{ needs.postgresql-rls.result }}" \
            "${{ needs.accessibility.result }}" \
            "${{ needs.external-links.result }}" \
            "${{ needs.secret-scan.result }}" \
            "${{ needs.verify-evidence-reports.result }}"
          do
            if [ "$result" != "success" ]; then
              echo "Required job result was $result"
              exit 1
            fi
          done
          echo "All required gh-pages quality jobs succeeded."
