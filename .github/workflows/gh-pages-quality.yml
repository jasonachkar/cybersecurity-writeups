name: gh-pages quality

on:
  pull_request:
    branches:
      - gh-pages
  push:
    branches:
      - codex/validated-gh-pages-deployment
  workflow_dispatch:

concurrency:
  group: gh-pages-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.1"
  GO_VERSION: "1.22.12"
  TERRAFORM_VERSION: "1.14.6"
  GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  GITHUB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  static-site:
    name: static-site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Generator idempotency check
        run: npm run verify:generated
      - name: Static validation
        run: npm run verify:static
      - name: Upload static reports
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: qa-static
          path: |
            qa/validation-report.json
            qa/html-validation-report.json
            qa/defect-check-report.json
          if-no-files-found: error

  javascript-labs:
    name: javascript-labs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install lab dependencies
        run: |
          set -euo pipefail
          npm ci --prefix labs/secure-cicd
          npm ci --prefix labs/kubernetes-security
          npm ci --prefix labs/supply-chain
      - run: npm run verify:node
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: qa-labs
          path: qa/labs-report.json
          if-no-files-found: error

  go-utilities:
    name: go-utilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: npm ci
      - run: npm run verify:go
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: qa-go
          path: qa/go-report.json
          if-no-files-found: error

  policy-and-iac:
    name: policy-and-iac
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - run: npm ci
      - name: Install OPA 1.17.0 and Bicep 0.36.1 (checksum verified)
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/tools
          node --input-type=module <<'EOF'
          import {fetchPinnedTool} from './scripts/fetch-pinned-tool.mjs';
          import {OPA_ARTIFACTS, OPA_VERSION, BICEP_ARTIFACTS, BICEP_VERSION} from './scripts/tool-pins.mjs';
          import fs from 'node:fs';
          const opa = OPA_ARTIFACTS['linux-amd64'];
          const opaDest = `qa-artifacts/tools/opa`;
          await fetchPinnedTool({url: opa.url, sha256: opa.sha256, destPath: opaDest});
          fs.chmodSync(opaDest, 0o755);
          const bicep = BICEP_ARTIFACTS['linux-amd64'];
          const bicepDest = `qa-artifacts/tools/bicep`;
          await fetchPinnedTool({url: bicep.url, sha256: bicep.sha256, destPath: bicepDest});
          fs.chmodSync(bicepDest, 0o755);
          console.log(`Pinned OPA ${OPA_VERSION} and Bicep ${BICEP_VERSION}`);
          EOF
          sudo mv qa-artifacts/tools/opa /usr/local/bin/opa
          sudo mv qa-artifacts/tools/bicep /usr/local/bin/bicep
          opa version
          bicep --version
      - name: Terraform / OPA / Bicep / schemas / Kyverno
        run: |
          set -euo pipefail
          npm run verify:terraform
          npm run verify:opa
          npm run verify:bicep
          npm run verify:policy-schemas
          npm run verify:kyverno
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: qa-policy-iac
          path: |
            qa/terraform-report.json
            qa/opa-report.json
            qa/bicep-report.json
            qa/policy-schemas-report.json
            qa/kyverno-report.json
          if-no-files-found: error

  postgresql-rls:
    name: postgresql-rls
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run verify:postgresql
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: qa-postgres
          path: qa/postgres-report.json
          if-no-files-found: error

  shell-powershell:
    name: shell-powershell
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install ShellCheck 0.10.0 and PowerShell 7.4.6 (checksum verified)
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/tools/powershell
          node --input-type=module <<'EOF'
          import {fetchPinnedTool} from './scripts/fetch-pinned-tool.mjs';
          import {SHELLCHECK_ARTIFACTS, SHELLCHECK_VERSION, POWERSHELL_ARTIFACTS, POWERSHELL_VERSION} from './scripts/tool-pins.mjs';
          const sc = SHELLCHECK_ARTIFACTS['linux-amd64'];
          await fetchPinnedTool({url: sc.url, sha256: sc.sha256, destPath: 'qa-artifacts/tools/shellcheck.tar.xz'});
          const ps = POWERSHELL_ARTIFACTS['linux-amd64'];
          await fetchPinnedTool({url: ps.url, sha256: ps.sha256, destPath: 'qa-artifacts/tools/powershell.tar.gz'});
          console.log(`Fetched ShellCheck ${SHELLCHECK_VERSION} and PowerShell ${POWERSHELL_VERSION}`);
          EOF
          tar -xJf qa-artifacts/tools/shellcheck.tar.xz -C qa-artifacts/tools
          tar -xzf qa-artifacts/tools/powershell.tar.gz -C qa-artifacts/tools/powershell
          sudo mv qa-artifacts/tools/shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck
          sudo ln -sfn "$(pwd)/qa-artifacts/tools/powershell/pwsh" /usr/local/bin/pwsh
          chmod +x /usr/local/bin/shellcheck
          chmod +x qa-artifacts/tools/powershell/pwsh
          shellcheck --version
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - run: npm ci
      - run: npm run verify:shell
      - run: npm run verify:powershell
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: qa-shell-powershell
          path: |
            qa/shell-report.json
            qa/powershell-report.json
          if-no-files-found: error

  accessibility:
    name: accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:a11y
      - run: npm run verify:ui
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: qa-accessibility
          path: |
            qa/accessibility-report.json
            qa/ui-layout-report.json
          if-no-files-found: error

  external-links:
    name: external-links
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run verify:links
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: qa-external-links
          path: qa/external-link-report.json
          if-no-files-found: error

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Gitleaks 8.30.0 (checksum verified)
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run verify:secrets
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: qa-gitleaks
          path: qa/gitleaks-report.json
          if-no-files-found: error

  verify-evidence-reports:
    name: verify-evidence-reports
    runs-on: ubuntu-24.04
    needs:
      - static-site
      - javascript-labs
      - go-utilities
      - policy-and-iac
      - postgresql-rls
      - shell-powershell
      - accessibility
      - external-links
      - secret-scan
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: qa-artifacts
      - name: Assemble and verify reports
        run: |
          set -euo pipefail
          mkdir -p qa
          # Fail on unexpected duplicate basenames across artifact directories.
          python3 - <<'PY'
          import os, sys
          root = "qa-artifacts"
          seen = {}
          dups = []
          for dirpath, _, files in os.walk(root):
              for name in files:
                  if not name.endswith(".json"):
                      continue
                  path = os.path.join(dirpath, name)
                  if name in seen:
                      dups.append((name, seen[name], path))
                  else:
                      seen[name] = path
          if dups:
              for name, a, b in dups:
                  print(f"duplicate evidence basename {name}: {a} and {b}", file=sys.stderr)
              sys.exit(1)
          print(f"unique evidence files: {len(seen)}")
          PY
          required=(
            qa-artifacts/qa-static/validation-report.json
            qa-artifacts/qa-static/html-validation-report.json
            qa-artifacts/qa-static/defect-check-report.json
            qa-artifacts/qa-labs/labs-report.json
            qa-artifacts/qa-go/go-report.json
            qa-artifacts/qa-policy-iac/terraform-report.json
            qa-artifacts/qa-policy-iac/opa-report.json
            qa-artifacts/qa-policy-iac/bicep-report.json
            qa-artifacts/qa-policy-iac/policy-schemas-report.json
            qa-artifacts/qa-policy-iac/kyverno-report.json
            qa-artifacts/qa-postgres/postgres-report.json
            qa-artifacts/qa-shell-powershell/shell-report.json
            qa-artifacts/qa-shell-powershell/powershell-report.json
            qa-artifacts/qa-accessibility/accessibility-report.json
            qa-artifacts/qa-accessibility/ui-layout-report.json
            qa-artifacts/qa-external-links/external-link-report.json
            qa-artifacts/qa-gitleaks/gitleaks-report.json
          )
          for src in "${required[@]}"; do
            if [[ ! -f "$src" ]]; then
              echo "missing required evidence file: $src" >&2
              exit 1
            fi
            cp "$src" qa/
          done
          npm run verify:summary
          npm run verify:provenance
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: qa-authoritative-summary
          path: qa/verification-summary.json
          if-no-files-found: error

  summary:
    name: summary
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - static-site
      - javascript-labs
      - go-utilities
      - policy-and-iac
      - postgresql-rls
      - shell-powershell
      - accessibility
      - external-links
      - secret-scan
      - verify-evidence-reports
    steps:
      - name: Require all jobs green
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.static-site.result }}" \
            "${{ needs.javascript-labs.result }}" \
            "${{ needs.go-utilities.result }}" \
            "${{ needs.policy-and-iac.result }}" \
            "${{ needs.postgresql-rls.result }}" \
            "${{ needs.shell-powershell.result }}" \
            "${{ needs.accessibility.result }}" \
            "${{ needs.external-links.result }}" \
            "${{ needs.secret-scan.result }}" \
            "${{ needs.verify-evidence-reports.result }}"
          do
            if [ "$result" != "success" ]; then
              echo "Required job result was $result"
              exit 1
            fi
          done
          echo "All required gh-pages quality jobs succeeded."
