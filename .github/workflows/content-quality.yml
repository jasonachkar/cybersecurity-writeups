name: Content quality and security examples

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "31 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.12.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate content and examples
        run: npm run validate

      - name: Check external links on scheduled runs
        if: github.event_name == 'schedule'
        run: npm run links:external

  docs-build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out reviewed revision with repository symlinks
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/docs-pipeline/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.12.0"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install exact build and QA dependencies
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-docs.txt
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Build and verify canonical documentation product
        run: npm run verify:docs

      - name: Upload the exact verified static site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-docs-${{ github.sha }}
          path: .artifacts/site
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Upload browser reports and visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-qa-failure-${{ github.sha }}
          path: |
            .artifacts/qa
            .artifacts/playwright
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history for secret scanning
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan committed history and proposed changes
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - docs-build
      - secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: github-pages-publication
      cancel-in-progress: false
    steps:
      - name: Check out exact canonical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false

      - name: Download the exact verified site without rebuilding
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-docs-${{ github.sha }}
          path: verified-site

      - name: Check out generated publication branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
          path: published-site
          fetch-depth: 1
          persist-credentials: true

      - name: Publish only the verified static artifact
        env:
          SITE_SOURCE_COMMIT: ${{ github.sha }}
        run: bash source/scripts/publish-gh-pages.sh "$GITHUB_WORKSPACE/verified-site" "$GITHUB_WORKSPACE/published-site"
